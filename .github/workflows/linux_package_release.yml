name: Linux Package Builder

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-packages:
    name: Build DEB/RPM Packages
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, ubuntu-22.04-arm]
        include:
          - platform: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install fpm --no-document

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create DEB packages
        run: |
          for app in scal sdate sstat; do
            EXTRA_FLAGS=""
            EXTRA_PATHS=""
            if [ "$app" == "scal" ]; then
              EXTRA_FLAGS="--depends sdate --depends sstat"
              EXTRA_PATHS="./man/slib.3.roff=/usr/share/man/man3/slib.3"
            fi
            fpm -s dir -t deb \
              -n $app \
              -v ${{ github.ref_name }} \
              -a ${{ matrix.deb_arch }} \
              --maintainer "Amir Arsalan Yavari" \
              --description "$app application" \
              $EXTRA_FLAGS \
              --package $app-${{ matrix.deb_arch }}.deb \
              ./target/${{ matrix.target }}/release/$app=/usr/bin/$app \
              ./man/$app.1.roff=/usr/share/man/man1/$app.1 \
              $EXTRA_PATHS
          done

      - name: Create RPM packages
        run: |
          for app in scal sdate sstat; do
            EXTRA_FLAGS=""
            EXTRA_PATHS=""
            if [ "$app" == "scal" ]; then
              EXTRA_FLAGS="--depends sdate --depends sstat"
              EXTRA_PATHS="./man/slib.3.roff=/usr/share/man/man3/slib.3"
            fi
            fpm -s dir -t rpm \
              -n $app \
              -v ${{ github.ref_name }} \
              -a ${{ matrix.rpm_arch }} \
              --maintainer "Amir Arsalan Yavari" \
              --description "$app application" \
              $EXTRA_FLAGS \
              --package $app-${{ matrix.rpm_arch }}.rpm \
              ./target/${{ matrix.target }}/release/$app=/usr/bin/$app \
              ./man/$app.1.roff=/usr/share/man/man1/$app.1 \
              $EXTRA_PATHS
          done

      - name: Upload packages
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-repo:
    name: Update APT/YUM Repository
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to gh-pages or create it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          mkdir -p apt yum

      - name: Install Repo Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern '*.deb' --dir apt/ --clobber || true
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern '*.rpm' --dir yum/ --clobber || true

      - name: Build APT Repository
        run: |
          cd apt
          dpkg-scanpackages -m . /dev/null > Packages
          gzip -9c Packages > Packages.gz
          apt-ftparchive release . > Release
          cd ..

      - name: Build YUM Repository
        run: |
          cd yum
          createrepo_c .
          cd ..

      - name: Commit and Push
        run: |
          git add apt/ yum/
          git commit -m "Update repository for release ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin gh-pages
